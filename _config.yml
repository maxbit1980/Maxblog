# ============================================================
#  MaxBlog — Configuração do site
#  Autor: Paulo Cesar
# ============================================================

title:    MaxBlog
tagline:  "Código, projetos e aprendizado contínuo"
description: >-
  Portfólio técnico e blog pessoal de Paulo Cesar. Aqui compartilho
  projetos, soluções de código, estudos em desenvolvimento de software
  e anotações sobre tecnologia.
lang: pt-BR
timezone: America/Sao_Paulo

author:
  name:  Paulo Cesar
  email: maxbit1980@gmail.com

theme: minima

baseurl: "/Maxblog"
url:     "https://maxbit1980.github.io"

github_username: maxbit1980

minima:
  skin: dark
  date_format: "%d/%m/%Y"
  show_excerpts: true
  social:
    - title: GitHub
      icon: github
      url: https://github.com/maxbit1980
    - title: YouTube
      icon: youtube
      url: https://www.youtube.com/@MaxOliver80
    - title: Facebook
      icon: facebook
      url: "https://www.facebook.com/profile.php?id=100083087514893"
    - title: E-mail
      icon: envelope
      url: mailto:maxbit1980@gmail.com

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .github/
  - README.md
